name: Update open PRs
# After every push to dev (a merged PR), merge dev into each open PR branch
# that targets dev, so the PRs stay mergeable. CLAUDE.md and
# docs/development/STATUS.md merge with the union driver (both new notes
# are kept). A branch with any other conflict is
# left as it is and listed in the log; docs/SHA256SUMS (a list of every
# tracked file's hash) is regenerated from the merged tree when it is the
# only other conflict. Also left alone and logged is a branch where the merge
# would change a file under .github/workflows (GITHUB_TOKEN may not push
# those; GitHub refuses the push).
#
# GITHUB_TOKEN pushes do not start other workflows, so after successfully
# updating a PR branch explicitly dispatch Check for that new revision.
# Branches with workflow-file conflicts still require a manual merge.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: update-prs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge dev into open PR branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Applies whatever .gitattributes the PR branch has.
          echo "CLAUDE.md merge=union" >> .git/info/attributes
          echo "docs/development/STATUS.md merge=union" >> .git/info/attributes
          git fetch -q origin dev
          dispatch_failures=$(mktemp)
          gh pr list --base dev --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' |
          while read -r number branch; do
            echo "::group::#$number $branch"
            if ! git fetch -q origin "refs/heads/$branch"; then
              echo "fetch failed"; echo "::endgroup::"; continue
            fi
            git checkout -q -B update FETCH_HEAD
            if git merge-base --is-ancestor origin/dev HEAD; then
              echo "already up to date"
            elif git merge -q --no-edit -m "Merge dev into $branch" origin/dev \
                || { [ "$(git diff --name-only --diff-filter=U)" = "docs/SHA256SUMS" ] \
                     && python3 tools/update_sha256sums.py \
                     && git add docs/SHA256SUMS \
                     && git commit -q --no-edit; }; then
              # GitHub refuses a GITHUB_TOKEN push that changes a workflow
              # file, so such a merge has to be done by hand (or by a session).
              workflows=$(git diff --name-only FETCH_HEAD HEAD -- .github/workflows)
              if [ -n "$workflows" ]; then
                echo "::warning::#$number not updated: merging dev changes workflow files, which GITHUB_TOKEN may not push. Merge dev into $branch by hand:"
                echo "$workflows"
              elif git push -q origin "HEAD:refs/heads/$branch"; then
                echo "merged dev and pushed"
                # GITHUB_TOKEN pushes do not trigger push/pull_request checks.
                # workflow_dispatch is an allowed exception.
                if gh workflow run check.yml --ref "$branch" -f full=false -f base_ref=dev; then
                  echo "dispatched Check for updated PR #$number ($branch)"
                else
                  echo "::error::#$number updated but Check dispatch failed: $branch"
                  echo "$number $branch" >> "$dispatch_failures"
                fi
              else
                echo "::warning::#$number push refused (see the message above); next push to dev retries"
              fi
            else
              echo "::warning::#$number has conflicts outside CLAUDE.md and STATUS.md:"
              git diff --name-only --diff-filter=U
              git merge --abort
            fi
            echo "::endgroup::"
          done
          if [ -s "$dispatch_failures" ]; then
            echo "::error::Some updated PR revisions did not receive Check:"
            cat "$dispatch_failures"
            exit 1
          fi
