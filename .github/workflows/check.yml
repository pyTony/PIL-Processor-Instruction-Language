name: Check
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo run --locked -- --selftest
      - run: python tools/build_selftest.py --check
      - run: python tools/build_hello.py --check
      - run: python tools/build_numeric.py --check
      - run: cargo run --locked -- --numeric-test
      - run: python tools/verify_memory.py
      - run: python tools/verify_descriptions.py
      - run: python tools/verify_flow.py
      - if: runner.os == 'Linux'
        run: sh tools/debug.sh --check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/debug.ps1 -Check
      - run: python tools/export_runtime.py target/runtime-source --verify
      - run: cargo build --release --locked
      - if: runner.os == 'Linux'
        run: sh tools/bench.sh 10000 5
      - if: runner.os == 'Linux'
        run: sh tools/bench.sh 10000 5 --uncached
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bench.ps1 -Iterations 10000 -Samples 5
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bench.ps1 -Iterations 10000 -Samples 5 -Uncached
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: pil-proof-${{ matrix.os }}
          path: dist/*.zip
