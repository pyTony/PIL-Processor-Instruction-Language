name: Check
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked -- --show-output
      - run: cargo run --locked -- --selftest
      - run: python -m unittest discover -s tests/gui -v
      - run: python tools/verify_debug_service.py
      - if: runner.os == 'Windows'
        run: python tools/verify_debug_service.py --window
      - run: python tools/build_selftest.py --check
      - run: python tools/build_hello.py --check
      - run: python tools/build_numeric.py --check
      - run: cargo run --locked -- --numeric-test
      - run: python tools/verify_memory.py
      - run: python tools/verify_descriptions.py
      - run: python tools/verify_flow.py
      - run: python tools/verify_extensions.py
      - run: python tools/verify_rotates.py
      - run: python tools/verify_exchange.py
      - run: python tools/verify_flag_transfer.py
      - run: python tools/verify_direction_flag.py
      - run: python tools/verify_dos_probe.py
      - if: runner.os == 'Linux'
        run: python tools/verify_dos_console.py --engine target/debug/pil --out target/console-fixtures
      - if: runner.os == 'Windows'
        run: python tools/verify_dos_console.py --engine target/debug/pil.exe --out target/console-fixtures
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q dosbox-x
      - if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/verify_dosbox_cpu.py --engine target/debug/pil --dosbox /usr/bin/dosbox-x --suite cpu --out target/dosbox-cpu
          python tools/verify_dosbox_cpu.py --engine target/debug/pil --dosbox /usr/bin/dosbox-x --suite console --out target/dosbox-console
      - run: python tools/verify_containers.py
      - if: runner.os == 'Linux'
        run: sh tools/debug.sh --check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/debug.ps1 -Check
      - run: python tools/export_runtime.py target/runtime-source --verify
      - run: cargo build --release --locked
      - if: runner.os == 'Linux'
        run: sh tools/bench.sh 10000 5
      - if: runner.os == 'Linux'
        run: sh tools/bench.sh 10000 5 --uncached
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bench.ps1 -Iterations 10000 -Samples 5
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bench.ps1 -Iterations 10000 -Samples 5 -Uncached
      - if: runner.os == 'Linux'
        run: sh tools/compare.sh 10000 5
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/compare.ps1 -Iterations 10000 -Samples 5
      - run: cargo run --release --locked -- --verify-backends
      - if: runner.os == 'Linux'
        run: sh tools/mandelbrot.sh 256 32
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/mandelbrot.ps1 -Size 256 -Iterations 32
      - run: python tools/verify_mandelbrot.py target/mandelbrot/256x256-i32/mandelbrot.pgm 256 32
      - if: runner.os == 'Linux'
        run: sh tools/mandelbrot.sh --compare 256 32
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/mandelbrot.ps1 -Compare -Size 256 -Iterations 32
      - run: python tools/package.py
      - uses: actions/upload-artifact@v6
        with:
          name: pil-${{ matrix.os }}
          path: |
            dist/*.zip
            target/host-cpu-oracle/run-*/report.txt
            target/host-cpu-oracle/run-*/cases.jsonl
            target/host-cpu-oracle/run-*/hardware.bin
            target/mandelbrot/256x256-i32/*
            target/backend-comparison/run-*/mandelbrot/*

