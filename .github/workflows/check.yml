name: Check
'on':
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev
  workflow_dispatch:
    inputs:
      full:
        description: Run every module (false uses affected paths)
        type: boolean
        default: true
      base_ref:
        description: Base branch for automated PR refresh comparisons
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      frontend: ${{ steps.diff.outputs.frontend }}
      integration: ${{ steps.diff.outputs.integration }}
      backends: ${{ steps.diff.outputs.backends }}
      delivery: ${{ steps.diff.outputs.delivery }}
      performance: ${{ steps.diff.outputs.performance }}
      web: ${{ steps.diff.outputs.web }}
      dos: ${{ steps.diff.outputs.dos }}
      library: ${{ steps.diff.outputs.library }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - id: diff
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        BASE_REF: ${{ inputs.base_ref }}
        FULL: ${{ inputs.full }}
      shell: bash
      run: |
        args=()
        if [ "$FULL" = true ]; then args+=(--full); fi
        python tools/ci_changes.py "${args[@]}"
    - run: python -m unittest discover -s tests/ci -v
    - run: python tools/check_portable_paths.py --self-test
    - run: python tools/check_program_specific.py --self-test
    - run: python tools/check_layers.py --self-test
    - run: python tools/export_runtime.py target/runtime-links
  frontend:
    name: web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m unittest discover -s tests/gui -p test_termux_web.py -v
    needs: changes
    if: needs.changes.outputs.web == 'true'
  affected:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.backends
      == 'true' || needs.changes.outputs.delivery == 'true' || needs.changes.outputs.performance == 'true' || needs.changes.outputs.frontend
      == 'true' || needs.changes.outputs.dos == 'true' || needs.changes.outputs.library == 'true'
    uses: ./.github/workflows/full.yml
    with:
      core: ${{ needs.changes.outputs.core == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      policy: false
      integration: ${{ needs.changes.outputs.integration == 'true' }}
      backends: ${{ needs.changes.outputs.backends == 'true' }}
      delivery: ${{ needs.changes.outputs.delivery == 'true' }}
      performance: ${{ needs.changes.outputs.performance == 'true' }}
      dos: ${{ needs.changes.outputs.dos == 'true' }}
      library: ${{ needs.changes.outputs.library == 'true' }}
  required:
    name: Required PR checks
    if: always()
    needs:
    - changes
    - frontend
    - affected
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        assert results['changes']['result'] == 'success', results
        assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
        print('All affected checks passed')
        PY
