[package]
name = "pil"
version = "0.38.0-alpha.1"
edition = "2021"

[workspace]
members = ["crates/pil-cpu", "crates/pil-pc", "crates/pil-bios"]
default-members = [".", "crates/pil-cpu", "crates/pil-pc", "crates/pil-bios"]

[dependencies]
pil-cpu = { path = "crates/pil-cpu" }
pil-pc = { path = "crates/pil-pc" }
pil-bios = { path = "crates/pil-bios" }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
# X11 window front end for Linux and Termux:X11 (pure Rust, no libX11).
x11rb = { version = "0.14.0", optional = true, features = ["xkb"] }

# Build the CPU and DOS implementation once as a Rust library used by pil,
# and expose it as the Dine shared library
# (C ABI in src/dine_ffi.rs). PIL and Dine are program-independent: no build
# embeds a guest program. The `pil` binary is the interpreter command. Plain `cargo build --release` builds all workspace libraries, the Dine shared library and `pil`.
[lib]
name = "dine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
# The shared implementation owns the unit tests. The binary is a thin caller.
# tools/verify_dine_library.py also exercises the C ABI on both hosts.

[features]
default = ["dine-library"]
# Build the shared DOS runtime C ABI (dine.dll / libdine.so); enabled by default.
dine-library = []
# Omit the generated native PIL instruction-form table. The generic interpreter
# remains available for both real and protected mode; the default build is unchanged.
compact-interpreter = ["pil-cpu/compact-interpreter"]
# A window for `pil --dos-console --window` on Linux and Termux:X11 (pure
# Rust X11 client). Without it the Unix console is the terminal (`--tty`).
x11 = ["dep:x11rb"]
# Keep per-instruction labels from native applications (debugging only).
debug-labels = []

[dev-dependencies]
pil-cpu = { path = "crates/pil-cpu", features = ["test-support"] }
pil-pc = { path = "crates/pil-pc", features = ["test-support"] }

# Omit DWARF local-variable records for the 5,369 generated instruction forms
# during unoptimized dev/test builds so 7 GB CI runners do not OOM.
[profile.dev.package.pil-cpu]
debug = false
