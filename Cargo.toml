[package]
name = "pil"
version = "0.37.0-alpha.2"
edition = "2021"

[dependencies]
thiserror = "1.0"

# The same CPU/DOS implementation is also built as a DLL/.so for small
# Dine_<program> launchers. Keep the original pil binary unchanged.
[lib]
name = "pil_dine"
path = "src/main.rs"
crate-type = ["cdylib"]
