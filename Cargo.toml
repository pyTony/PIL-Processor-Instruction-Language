[package]
name = "pil"
version = "0.37.0-alpha.2"
edition = "2021"

[dependencies]
thiserror = "1.0"

# Build the same CPU and DOS implementation as a reusable native Dine
# runtime, independent of guest programs. The existing `pil` binary remains
# the compiler/interpreter command. Build with `cargo build --release --lib`.
[lib]
name = "dine"
path = "src/main.rs"
crate-type = ["cdylib"]

[features]
# Build the shared DOS runtime C ABI, not part of normal pil CLI builds.
dine-library = []
