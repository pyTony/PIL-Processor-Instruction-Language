<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
<meta name="color-scheme" content="dark">
<title>PILdos on Android</title>
<style>
:root { color-scheme:dark; --bg:#10141b; --panel:#202a36; --ink:#eff4ff; --muted:#aab7c9; --accent:#80dfff; }
* { box-sizing:border-box; }
body { margin:0; padding:12px; font:15px system-ui,sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin:0 auto 12px; max-width:1000px; }
h1 { margin:0; font-size:20px; letter-spacing:.03em; }
small { color:var(--muted); }
main { max-width:1000px; margin:0 auto; }
.screen { background:#000; border:2px solid #364557; border-radius:7px; overflow:hidden; box-shadow:0 6px 28px #0007; }
canvas { width:100%; aspect-ratio:4/3; display:block; background:#000; image-rendering:pixelated; touch-action:none; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 0; }
button,select,input { font:inherit; background:var(--panel); color:var(--ink); border:1px solid #4d6075; border-radius:7px; padding:10px 13px; min-height:43px; }
button { cursor:pointer; user-select:none; touch-action:manipulation; }
button:active { background:#48637c; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); }
#status { color:var(--muted); overflow-wrap:anywhere; margin:6px 0 12px; min-height:2em; }
.keys { display:grid; grid-template-columns:repeat(auto-fit,minmax(65px,1fr)); gap:7px; margin:10px 0; }
.keys button { font-weight:bold; }
.type { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.type input { flex:1 1 200px; }
#log { white-space:pre-wrap; max-height:110px; overflow:auto; color:#b3d7af; font:12px ui-monospace,monospace; }
details { color:var(--muted); margin-top:14px; }
footer { color:var(--muted); font-size:12px; margin-top:20px; }
@media (max-width:420px) { body { padding:6px; } h1 { font-size:17px; } .keys { grid-template-columns:repeat(5,1fr); } .keys button { padding:8px 1px; font-size:13px; } }
</style>
</head>
<body>
<header>
<div><h1>PILdos · Android</h1><small>Native Android browser, no X11</small></div>
<button id="toggle" aria-pressed="true">Pause</button>
</header>
<main>
<section class="screen" aria-label="DOS graphics and text screen">
<canvas id="display" width="720" height="400" tabindex="0" aria-label="DOS screen. Tap for mouse or press a key."></canvas>
</section>
<div id="status" role="status">Connecting to PILdos...</div>
<div class="controls">
<label>CPU slice <select id="budget"><option value="5000">5k</option><option value="20000" selected>20k</option><option value="50000">50k</option></select></label>
<button id="break">Ctrl+Break</button>
<button id="refresh">Refresh</button>
</div>
<section class="keys" aria-label="On-screen DOS keyboard">
<button data-ascii="27" data-scan="1">Esc</button>
<button data-ascii="0" data-scan="72">↑</button>
<button data-ascii="13" data-scan="28">Enter</button>
<button data-ascii="0" data-scan="75">←</button>
<button data-ascii="0" data-scan="77">→</button>
<button data-ascii="0" data-scan="80">↓</button>
<button data-ascii="8" data-scan="14">Bksp</button>
<button data-ascii="9" data-scan="15">Tab</button>
<button data-ascii="0" data-scan="59">F1</button>
<button data-ascii="0" data-scan="60">F2</button>
<button data-ascii="0" data-scan="61">F3</button>
<button data-ascii="0" data-scan="62">F4</button>
<button data-ascii="0" data-scan="63">F5</button>
<button data-ascii="0" data-scan="64">F6</button>
<button data-ascii="0" data-scan="65">F7</button>
<button data-ascii="0" data-scan="66">F8</button>
<button data-ascii="0" data-scan="67">F9</button>
<button data-ascii="0" data-scan="68">F10</button>
<button data-ascii="0" data-scan="73">PgUp</button>
<button data-ascii="0" data-scan="81">PgDn</button>
</section>
<form class="type" id="typeform"><input id="type" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Android keyboard: type DOS text" aria-label="Text for DOS keyboard"><button type="submit">Type</button><button id="typeenter" type="button">Type + ↵</button></form>
<details><summary>Console output</summary><pre id="log"></pre></details>
<footer>Uses the existing general-purpose PIL DOS session. Text, CGA, EGA and VGA are drawn from guest video memory. Tap the screen for an opt-in DOS mouse.</footer>
</main>
<script>
"use strict";
const canvas=document.getElementById("display"), ctx=canvas.getContext("2d",{alpha:false});
const status=document.getElementById("status"), log=document.getElementById("log");
let glyphs=[], colors=[], latest=null, running=true, inLoop=false, terminated=false;
let buttons=0, imageMouse=false;
const waits={normal:60,idle:180};
function bytes(hex) {
  if(typeof hex!=="string" || hex.length%2) throw Error("bad frame encoding");
  const out=new Uint8Array(hex.length/2);
  for(let i=0;i<out.length;i++)out[i]=parseInt(hex.slice(i*2,i*2+2),16);
  return out;
}
function resize(w,h){
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w;canvas.height=h; }
  canvas.style.aspectRatio="4 / 3";
  ctx.imageSmoothingEnabled=false;
}
function textFrame(reply){
  const data=bytes(reply.screen||"");
  if(data.length%2 || data.length<160) return;
  const cols=reply.columns||80, rows=Math.floor(data.length/(cols*2));
  const cw=9,ch=16;
  resize(cols*cw,rows*ch);
  ctx.textBaseline="top";ctx.font="15px monospace";
  for(let i=0;i<cols*rows;i++){
    const x=(i%cols)*cw, y=Math.floor(i/cols)*ch, attr=data[i*2+1];
    ctx.fillStyle=colors[(attr>>>4)&15]||"#000";
    ctx.fillRect(x,y,cw,ch);
    ctx.fillStyle=colors[attr&15]||"#aaa";
    ctx.fillText(glyphs[data[i*2]]||" ",x,y);
  }
  if(Array.isArray(reply.cursor)){
    const [y,x]=reply.cursor;
    if(x<cols&&y<rows){ctx.fillStyle="#ccc";ctx.fillRect(x*cw,y*ch+14,cw,2);}
  }
}
function rgbaFrame(w,h,pixel){
  resize(w,h);
  const img=ctx.createImageData(w,h),d=img.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const index=(y*w+x)*4,rgb=pixel(x,y);
    d[index]=rgb[0];d[index+1]=rgb[1];d[index+2]=rgb[2];d[index+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function mode13(reply){
  const data=bytes(reply.graphics13), pal=bytes(reply.palette);
  if(data.length!==64000||pal.length!==768)throw Error("mode 13 frame size mismatch");
  rgbaFrame(320,200,(x,y)=>{const i=data[y*320+x]*3;return [pal[i],pal[i+1],pal[i+2]];});
}
function cga(reply){
  const mode=reply.cga_mode, value=reply.cga_color, data=bytes(reply.graphics_cga);
  const pal=colors.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
  if(data.length!==16384)throw Error("CGA frame size mismatch");
  const w=mode===6?640:320;
  let indices;
  if(mode===6)indices=[0,value&15];
  else{
    const base=mode===5?[3,4,7]:(value&0x20?[3,5,7]:[2,4,6]);
    indices=[value&15,...base.map(i=>i+(value&0x10?8:0))];
  }
  rgbaFrame(w,200,(x,y)=>{
    const address=(y&1)*0x2000+Math.floor(y/2)*80+Math.floor(x/(mode===6?8:4));
    const b=data[address],i=mode===6?(b>>(7-x%8))&1:(b>>(6-2*(x%4)))&3;
    return pal[indices[i]]||[0,0,0];
  });
}
function planar(reply){
  const w=reply.planar_width,h=reply.planar_height,data=bytes(reply.graphics_planar),pal=bytes(reply.planar_rgb);
  const plane=Math.floor(w*h/8);
  if(plane*4!==data.length||pal.length!==48)throw Error("planar frame size mismatch");
  rgbaFrame(w,h,(x,y)=>{
    const offset=y*(w/8)+Math.floor(x/8),bit=7-x%8;
    let index=0;
    for(let n=0;n<4;n++)index|=((data[n*plane+offset]>>bit)&1)<<n;
    return [pal[index*3],pal[index*3+1],pal[index*3+2]];
  });
}
function paint(reply){
  latest=reply;
  if(reply.graphics13)mode13(reply);
  else if(reply.graphics_cga)cga(reply);
  else if(reply.graphics_planar)planar(reply);
  else if(reply.screen)textFrame(reply);
  if(reply.output){
    log.textContent=(log.textContent+reply.output).slice(-4000);
    log.scrollTop=log.scrollHeight;
  }
  const detail=(reply.detail||reply.text||"").slice(0,500);
  status.textContent="DOS: "+(reply.status||"unknown")+" | steps "+(reply.steps||0)+(detail?" | "+detail:"");
  if(reply.status==="exit"||reply.status==="stopped"||reply.status==="monitor") {
    running=false;document.getElementById("toggle").textContent="Resume";
    document.getElementById("toggle").setAttribute("aria-pressed","false");
  }
}
async function api(path,body){
  const options=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const response=await fetch(path,options);
  const json=await response.json();
  if(!response.ok)throw Error(json.error||response.statusText);
  return json;
}
function error(e){
  status.textContent="PILdos: "+String(e.message||e);
  running=false;document.getElementById("toggle").textContent="Resume";
}
async function refresh(){try{paint(await api("/api/state"));}catch(e){error(e);}}
async function loop(){
  if(inLoop||!running)return;
  inLoop=true;
  try{
    while(running){
      if(document.hidden){await new Promise(resolve=>setTimeout(resolve,450));continue;}
      const budget=Number(document.getElementById("budget").value);
      const reply=await api("/api/run",{budget});
      paint(reply);
      await new Promise(resolve=>setTimeout(resolve,reply.idle_hint?waits.idle:waits.normal));
    }
  }catch(e){error(e);}finally{inLoop=false;}
}
async function key(ascii,scan){try{await api("/api/key",{ascii,scan});}catch(e){error(e);}}
document.querySelectorAll("[data-ascii]").forEach(b=>b.addEventListener("click",()=>key(Number(b.dataset.ascii),Number(b.dataset.scan))));
const scans={Escape:[27,1],Enter:[13,28],Backspace:[8,14],Tab:[9,15],
 ArrowUp:[0,72],ArrowDown:[0,80],ArrowLeft:[0,75],ArrowRight:[0,77],
 Home:[0,71],End:[0,79],PageUp:[0,73],PageDown:[0,81],Insert:[0,82],Delete:[0,83]};
"1234567890".split("").forEach((c,i)=>{scans["Digit"+c]=[c.charCodeAt(0),i===9?11:i+2];});
"QWERTYUIOP".split("").forEach((c,i)=>scans["Key"+c]=[c.toLowerCase().charCodeAt(0),16+i]);
"ASDFGHJKL".split("").forEach((c,i)=>scans["Key"+c]=[c.toLowerCase().charCodeAt(0),30+i]);
"ZXCVBNM".split("").forEach((c,i)=>scans["Key"+c]=[c.toLowerCase().charCodeAt(0),44+i]);
for(let i=1;i<=10;i++)scans["F"+i]=[0,58+i];
document.addEventListener("keydown",e=>{
  if(e.target===document.getElementById("type"))return;
  if(e.repeat||e.altKey||e.metaKey)return;
  let value=scans[e.code]||scans[e.key];
  if(value){
    let [ascii,scan]=value;
    if(e.ctrlKey&&e.code.startsWith("Key"))ascii=e.code.charCodeAt(3)-64;
    else if(ascii&&e.key.length===1&&e.key.charCodeAt(0)<127)ascii=e.key.charCodeAt(0);
    e.preventDefault();key(ascii,scan);
  }else if(e.key===" "){e.preventDefault();key(32,57);}
});
const field=document.getElementById("type");
async function typeText(addEnter=false){
  const text=field.value+(addEnter?"\n":"");field.value="";
  if(!text)return;
  try{await api("/api/type",{text});}catch(e){error(e);}
}
document.getElementById("typeform").addEventListener("submit",e=>{e.preventDefault();typeText();});
document.getElementById("typeenter").addEventListener("click",()=>typeText(true));
document.getElementById("toggle").addEventListener("click",()=>{
  running=!running;
  document.getElementById("toggle").textContent=running?"Pause":"Resume";
  document.getElementById("toggle").setAttribute("aria-pressed",String(running));
  if(running)loop();
});
document.getElementById("break").addEventListener("click",async()=>{try{paint(await api("/api/break",{}));}catch(e){error(e);}});
document.getElementById("refresh").addEventListener("click",refresh);
function mousePosition(e){
  const rect=canvas.getBoundingClientRect(),maxX=latest?.mouse_max_x??639,maxY=latest?.mouse_max_y??199;
  return [Math.min(maxX,Math.max(0,Math.floor((e.clientX-rect.left)*maxX/rect.width))),
          Math.min(maxY,Math.max(0,Math.floor((e.clientY-rect.top)*maxY/rect.height)))];
}
async function mouse(e,down){
  if(!latest?.mouse_present)return;
  if(down)canvas.setPointerCapture(e.pointerId);
  const [x,y]=mousePosition(e);buttons=down?1:0;
  try{await api("/api/mouse",{x,y,buttons});}catch(err){error(err);}
}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();mouse(e,true);});
canvas.addEventListener("pointerup",e=>{e.preventDefault();mouse(e,false);});
canvas.addEventListener("pointercancel",e=>mouse(e,false));
(async()=>{
 try{
   const meta=await api("/api/meta");glyphs=Array.from(meta.glyphs);colors=meta.colors;
   await refresh();
   loop();
 }catch(e){error(e);}
})();
</script>
</body>
</html>
